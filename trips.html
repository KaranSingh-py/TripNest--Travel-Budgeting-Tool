<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Trips | TripNest</title>
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/responsive.css">
</head>
<body data-page="trips">
  <div class="app-shell">
    <aside class="sidebar" id="appSidebar">
      <div class="sidebar-brand">
        <a href="./index.html" class="brand-logo" aria-label="TripNest Home">
          <svg class="logo-icon" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
              <circle cx="12" cy="10" r="3"></circle>
          </svg>
          <span class="brand-text">Trip<strong>Nest</strong></span>
        </a>
        <button type="button" class="sidebar-close-btn" id="closeSidebarBtn">&times;</button>
      </div>
      <div class="sidebar-user-card">
        <div class="user-avatar" id="sidebarUserAvatar">AR</div>
        <div class="user-info">
          <strong id="sidebarUserName">Alex Rivera</strong>
          <span class="user-meta" id="sidebarUserCurrency">Home: USD</span>
        </div>
      </div>
      <nav class="sidebar-nav">
        <ul class="sidebar-menu">
          <li><a href="./dashboard.html" class="sidebar-link ">Dashboard</a></li>
          <li><a href="./trips.html" class="sidebar-link active">My Trips</a></li>
          <li><a href="./trip-details.html" class="sidebar-link ">Active Trip</a></li>
          <li><a href="./destinations.html" class="sidebar-link ">Destinations</a></li>
          <li><a href="./wishlist.html" class="sidebar-link ">Wishlist</a></li>
          <li><a href="./reports.html" class="sidebar-link ">Reports</a></li>
          <li><a href="./profile.html" class="sidebar-link ">Profile</a></li>
          <li><a href="./admin.html" class="sidebar-link ">Admin</a></li>
        </ul>
      </nav>
      <div class="sidebar-footer">
        <button type="button" id="logoutBtn" class="btn btn-outline btn-sm btn-block">Logout</button>
      </div>
    </aside>
    
    <div class="workspace-wrapper">
      <header class="topbar">
        <div class="topbar-left">
          <button type="button" class="mobile-menu-btn" id="openSidebarBtn">&#9776;</button>
          <div>
            <h1 class="page-title">My Trips</h1>
            <p class="page-subtitle">TripNest Workspace</p>
          </div>
        </div>
        <div class="topbar-actions">
          <button type="button" id="themeToggleBtn" class="btn btn-icon btn-sm" aria-label="Toggle color theme">
            <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          </button>
        </div>
      </header>
      
      <main class="workspace-main">
        <section class="card filter-bar">
          <form id="tripFilterForm" class="filter-grid">
            <div class="form-group"><label>Search Trips</label><input type="search" id="searchTripInput" placeholder="Kyoto, Alps..."></div>
            <div class="form-group"><label>Status</label><select id="filterTripStatus"><option value="all">All</option><option value="upcoming">Upcoming</option><option value="ongoing">Ongoing</option><option value="completed">Completed</option></select></div>
            <div class="form-group"><label>Sort By</label><select id="sortTripsBy"><option value="startDateAsc">Start Date</option><option value="budgetDesc">High Budget</option></select></div>
          </form>
        </section>

        <section>
          <div class="section-title-row"><h2>Your Trips</h2><span class="badge badge-info" id="tripCountBadge"></span></div>
          <div id="tripsGridContainer" class="cards-grid"></div>
        </section>

        <section id="tripFormSection" class="card">
          <div class="card-header-flex"><h2 id="tripFormHeading">Create / Edit Trip</h2><span class="badge badge-accent" id="tripFormModeBadge">Create</span></div>
          <form id="tripForm">
            <input type="hidden" id="tripIdInput">
            <div class="form-row">
              <div class="form-group"><label>Trip Title</label><input type="text" id="tripTitle" required></div>
              <div class="form-group"><label>Destination</label><input type="text" id="tripDestination" required></div>
            </div>
            <div class="form-row">
              <div class="form-group"><label>Start Date</label><input type="date" id="tripStartDate" required></div>
              <div class="form-group"><label>End Date</label><input type="date" id="tripEndDate" required></div>
              <div class="form-group"><label>Status</label><select id="tripStatus" required><option value="planning">Planning</option><option value="upcoming" selected>Upcoming</option><option value="ongoing">Ongoing</option><option value="completed">Completed</option></select></div>
            </div>
            <div class="form-row">
              <div class="form-group"><label>Total Budget</label><input type="number" id="tripTotalBudget" required></div>
              <div class="form-group"><label>Currency</label><select id="tripCurrency" required><option value="USD">USD</option><option value="INR">INR</option></select></div>
              <div class="form-group"><label>Travelers</label><input type="number" id="tripTravelersCount" value="1" required></div>
              <div class="form-group"><label>Budget Style</label><select id="tripBudgetTemplate" required><option value="moderate" selected>Moderate</option><option value="luxury">Luxury</option></select></div>
            </div>
            <div class="form-group"><label>Notes</label><textarea id="tripNotes"></textarea></div>
            <div class="form-actions"><button type="submit" class="btn btn-primary">Save Trip</button> <button type="reset" class="btn btn-outline" id="cancelTripEditBtn">Cancel</button></div>
          </form>
        </section>
      </main>

    </div>
  </div>
  
  <script src="./js/unit4/basic.js"></script>
  <script src="./js/unit6/error-handler.js"></script>
  <script src="./js/unit5/storage.js"></script>
  <script src="./js/unit5/theme.js"></script>
  <script src="./js/unit5/auth.js"></script>
  <script src="./js/unit5/currency.js"></script>
  <script src="./js/unit5/trips.js"></script>
  <script src="./js/unit5/budget.js"></script>
  <script src="./js/unit5/expenses.js"></script>
  <script src="./js/unit5/split-expenses.js"></script>
  <script src="./js/unit5/itinerary.js"></script>
  <script src="./js/unit5/checklist.js"></script>
  <script src="./js/unit5/packing-list.js"></script>
  <script src="./js/unit5/search-filter.js"></script>
  <script src="./js/unit5/destinations.js"></script>
  <script src="./js/unit5/reminders.js"></script>
  <script src="./js/unit5/savings.js"></script>
  <script src="./js/unit5/dashboard.js"></script>
  <script src="./js/unit6/reports.js"></script>
  <script src="./js/unit6/export.js"></script>
  <script src="./js/unit6/admin.js"></script>
  <script src="./js/unit6/app.js"></script>
</body>
</html>
